syntax = "proto3";
option csharp_namespace = "FitPulse.Grpc";

service Telemetry {
  rpc RecordReadings (stream TelemetryReadingRequest) returns (TelemetrySummaryResponse);
  rpc ReportDiagnostic (SensorDiagnosticRequest) returns (SensorDiagnosticResponse);
}

message TelemetryReadingRequest {
  int32 session_id = 1;
  int32 device_id = 2;
  double power_watts = 3;
  double speed_or_cadence = 4;
  double distance_or_reps = 5;
  int32 heart_rate = 6;
  double motor_temp = 7;
}

message TelemetrySummaryResponse {
  int32 processed_count = 1;
  string status_message = 2;
}

message SensorDiagnosticRequest {
  int32 device_id = 1;
  string sensor_type = 2;
  string error_code = 3;
  string severity = 4;
  string raw_sensor_data_json = 5;
}

message SensorDiagnosticResponse {
  bool accepted = 1;
}